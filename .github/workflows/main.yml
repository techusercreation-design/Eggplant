name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Auto-Find Project and Build APK
      run: |
        # အကယ်၍ ZIP ဖိုင်တင်မိထားပါက အလိုအလျောက် ဖြည်ပေးရန်
        for z in *.zip; do
          if [ -f "$z" ]; then
            unzip -o "$z"
          fi
        done

        # settings.gradle သို့မဟုတ် settings.gradle.kts ရှိသော ဖိုဒါကို အလိုအလျောက် ရှာဖွေခြင်း
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        
        if [ -z "$SETTINGS_FILE" ]; then
          echo "Error: Gradle build files not found in the repository!"
          ls -R
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "Found Gradle project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # gradlew ရှိမရှိ စစ်ဆေးပြီး Build လုပ်ရန်
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-App-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
